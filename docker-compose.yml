services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: consignado
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-queue:
    image: redis:alpine
    ports:
      - '6379:6379'

  redis-cache:
    image: redis:alpine
    ports:
      - '6380:6379'

volumes:
  postgres-data:
